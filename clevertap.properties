# =============================================================================
#  CleverTap configuration  ->  ADD YOUR DASHBOARD CREDENTIALS HERE
# =============================================================================
# Where to find them: CleverTap Dashboard > Settings > Project
#   Project ID    -> CLEVERTAP_ACCOUNT_ID
#   Project Token -> CLEVERTAP_TOKEN
#
# Region (data centre) – derive it from your dashboard URL:
#   eu1.dashboard.clevertap.com  -> leave CLEVERTAP_REGION empty (EU is the default)
#   in1.dashboard.clevertap.com  -> in1
#   us1.dashboard.clevertap.com  -> us1
#   sg1.dashboard.clevertap.com  -> sg1
#   aps3.dashboard.clevertap.com -> aps3
#   mec1.dashboard.clevertap.com -> mec1
#
# These values are injected into AndroidManifest.xml by app/build.gradle.kts.
# Re-sync Gradle after editing this file.
# =============================================================================

CLEVERTAP_ACCOUNT_ID=xxxxxxx
CLEVERTAP_TOKEN=xxxxxxx
CLEVERTAP_REGION=eu1
